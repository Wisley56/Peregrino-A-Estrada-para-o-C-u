# A cada push e pull request: tipos, lint, testes unitários, build e o teste de fumaça nas regiões.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build

      - name: Navegador do teste de fumaça
        run: npx playwright install --with-deps chromium

      - name: Teste de fumaça
        run: npm run test:fumaca

      - name: Relatório do teste de fumaça
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-fumaca
          path: test-results/
          retention-days: 7
